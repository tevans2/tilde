[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tilde-types = { path = "crates/tilde-types" }
tilde-fs = { path = "crates/tilde-fs" }
tilde-query = { path = "crates/tilde-query" }
tilde-config = { path = "crates/tilde-config" }
tilde-index = { path = "crates/tilde-index" }
tilde-ops = { path = "crates/tilde-ops" }
tilde-edit = { path = "crates/tilde-edit" }
tilde-preview = { path = "crates/tilde-preview" }
tilde-activity = { path = "crates/tilde-activity" }
tilde-nvim = { path = "crates/tilde-nvim" }
tilde-cleanup = { path = "crates/tilde-cleanup" }
tilde-contents = { path = "crates/tilde-contents" }
libc = "0.2"
plist = "1"
rmpv = "1.3"
nucleo-matcher = "0.3"
uniffi = "0.32"
tempfile = "3"
thiserror = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

# Optimize dependencies even in debug builds: unoptimized nucleo is ~50x slower, too slow
# to search a large index. Our own crates stay debuggable and quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

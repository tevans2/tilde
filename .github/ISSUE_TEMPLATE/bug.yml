name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ~/Downloads
        2. Press esc, then d
        3. …
  - type: input
    id: version
    attributes:
      label: Tilde version
      description: Tilde › About Tilde (or "built from source at <commit>")
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant parts of ~/.config/tilde/config.toml, if you changed anything.
      render: toml
